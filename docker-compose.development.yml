version: '3'

services:

  prism:
    build:
      context: .
    volumes:
      - '.:/prism'
    ports:
      - "8001:8000"
    environment:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - S3_BUCKET
      - S3_ENDPOINT_URL
      - AWS_REGION
      - TEST_IMAGE
    env_file:
      - .env
    command: [ "uwsgi", "--ini", "prism.uwsgi.development.ini" ]

  minio:
    # The upstream minio/minio and minio/mc images can no longer be pulled anonymously. This image
    # bundles the MinIO server, mc and a shell, and is pinned by digest. It is built by the public
    # repository https://github.com/RolnickLab/minio-image; see it to move to a newer release.
    image: insectai/minio:RELEASE.2026-09-16T00-00-00Z@sha256:1dca54196431cf11e745ebf743e1ceaa69f6d5a3070a6d8b068c7f5b0c981fa1
    command: server /data --console-address ':40283'
    ports:
      - "9000:9000"
      - "40283:40283"
    env_file:
      - .env
    # volumes:
    #   - ./compose/volumes/minio-config:/root/.minio
    #   - ./compose/volumes/minio-data:/data


  minioclient:
    # Same image as the minio service, for its bundled mc.
    image: insectai/minio:RELEASE.2026-09-16T00-00-00Z@sha256:1dca54196431cf11e745ebf743e1ceaa69f6d5a3070a6d8b068c7f5b0c981fa1
    depends_on:
      - minio
    env_file:
      - .env
    volumes:
      - ./compose/minio:/etc/minio
      # - ./compose/volumes/minio-client-config:/root/.mc
    entrypoint: /etc/minio/create_buckets.sh ${SECRETS_BUCKET} prism-test-source-mike prism-test-source-sara prism-test-thumbs-sara

volumes:
  minio-data:


