name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels the run it supersedes. Runs on main are never cancelled,
# so every commit that lands there gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Building ImageMagick from source takes most of this.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Nothing after checkout talks to GitHub, so the token is not left in .git/config.
          persist-credentials: false

      - name: Build the test image
        run: docker compose -f docker-compose.test.yml build tests

      - name: Start MinIO and wait until it is healthy
        run: docker compose -f docker-compose.test.yml up --detach --wait minio

      - name: Run the test suite
        # Creates the test buckets first (the "buckets" service), then runs every test,
        # including the write-back tests against MinIO.
        run: docker compose -f docker-compose.test.yml run --rm tests

      - name: Show container logs
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color --timestamps

      - name: Stop containers and remove volumes
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans
